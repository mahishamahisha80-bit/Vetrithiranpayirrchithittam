{% extends 'base.html' %}{% block content %}<div class="pagehead"><p class="eyebrow">PARTY PLANNER</p><h1>Plan the celebration</h1><p>Allocate your event budget across food, venue, decoration and more.</p></div><form id="party-form" class="planner-form"><label>Budget (₹)<input id="budget" type="number" min="1" required></label><label>Guests<input id="guests" type="number" min="1" required></label><label>Event type<select id="event_type"><option>Birthday</option><option>Wedding</option><option>Corporate</option><option>Anniversary</option><option>House Party</option></select></label><label>Venue preference<input id="venue" placeholder="Banquet hall, home, hotel..."></label><label>City<input id="city" value="India"></label><label>Preferences<textarea id="preferences" placeholder="Vegetarian food, theme, music, etc."></textarea></label><button class="button">Generate Party Plan</button></form><div id="result"></div><script>document.addEventListener('DOMContentLoaded',()=>document.getElementById('party-form').onsubmit=submitParty)</script>{% endblock %}
