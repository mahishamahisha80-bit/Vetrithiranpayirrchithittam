{% extends 'base.html' %}{% block content %}<div class="pagehead"><p class="eyebrow">JEWELRY PLANNER</p><h1>Find a coordinated look</h1><p>Add an outfit image for optional multimodal AI analysis.</p></div><form id="jewelry-form" class="planner-form" enctype="multipart/form-data"><label>Budget (₹)<input id="budget" name="budget" type="number" min="1" required></label><label>Occasion<input id="occasion" name="occasion" placeholder="Wedding, party, office..." required></label><label>Style<select id="style" name="style"><option>elegant</option><option>minimal</option><option>traditional</option><option>statement</option><option>contemporary</option></select></label><label>Metal<select id="metal" name="metal"><option>any</option><option>gold</option><option>silver</option><option>rose gold</option></select></label><label>Outfit description<textarea id="outfit_description" name="outfit_description"></textarea></label><label>Outfit image (optional)<input id="outfit_image" name="outfit_image" type="file" accept="image/jpeg,image/png,image/webp"></label><button class="button">Generate Jewelry Plan</button></form><div id="result"></div><script>document.addEventListener('DOMContentLoaded',()=>document.getElementById('jewelry-form').onsubmit=submitJewelry)</script>{% endblock %}
