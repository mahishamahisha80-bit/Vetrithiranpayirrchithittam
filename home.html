{% extends 'base.html' %}{% block content %}<div class="pagehead"><p class="eyebrow">HOME INTERIOR</p><h1>Build your home plan</h1><p>Set a total budget, rooms, style and quantities.</p></div><form id="home-form" class="planner-form"><label>Budget (₹)<input id="budget" type="number" min="1" required></label><label>Rooms<select id="rooms" multiple><option>Living Room</option><option>Bedroom</option><option>Kitchen</option><option>Dining Room</option><option>Study</option></select></label><label>Style<select id="style"><option>modern</option><option>minimal</option><option>traditional</option><option>bohemian</option><option>industrial</option></select></label><label>Location<input id="location" value="India"></label><div><b>Items</b><div id="home-items"></div><button type="button" class="button ghost" onclick="addHomeItem()">+ Add item</button></div><button class="button" type="submit">Generate Home Plan</button></form><div id="result"></div><script>document.addEventListener('DOMContentLoaded',()=>{addHomeItem();document.getElementById('home-form').onsubmit=submitHome})</script>{% endblock %}
